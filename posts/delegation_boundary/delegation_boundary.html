<style>

<div class="sheet">

<div class="topbar">
  <div class="eyebrow" data-i="eyebrow"></div>

    <nav class="langs" id="langs" aria-label="Language"></nav>
  </div>
</div>

<header>
  <h1 data-i="title"></h1>
  <p class="subtitle" data-i="subtitle"></p>
</header>

<section>

  <h2 data-i="modelH"></h2>
  <div class="h2-note" data-i="modelNote"></div>

  <p data-i="p1"></p>
  <div class="formula-block std-only"><span class="kx-d" data-tk="texS"></span></div>

  <p style="margin-top:14px" data-i="p2"></p>
  <div class="formula-block std-only"><span class="kx-d" data-tex="S=\Phi(E),\qquad \Phi:\mathcal{E}\to\mathcal{S}"></span></div>

  <p style="margin-top:14px" data-i="p3"></p>
  <div class="comp-grid">
    <div class="comp"><b>δ</b><span data-i="cD"></span></div>

    <div class="comp"><b>ρ</b><span data-i="cR"></span></div>
    <div class="comp"><b>γ</b><span data-i="cG"></span></div>
  </div>

  <div class="std-only">
    <p style="margin-top:22px" data-i="pG"></p>
    <div class="formula-block"><span class="kx-d" data-tex="\Gamma=\{\,(a,t)\;:\;a\in\partial D(t)\,\}\;\subset\;\mathcal{A}\times\mathbb{R}"></span></div>
  </div>

  <p style="margin-top:14px" data-i="p4"></p>
  <div class="main-caption std-only" data-i="mainCap"></div>
  <div class="formula-block formula-boxed std-only"><span class="kx-d" data-tk="texThr"></span></div>
  <div class="kid-rule kid-only" data-i="kidRule"></div>

  <p class="math-note std-only" data-i="mathNote"></p>
</section>

<section>

  <p data-i="wlP"></p>

  </div>

    <div class="lg"><svg width="26" height="16"><line x1="1" y1="8" x2="25" y2="8" stroke="#B5352C" stroke-width="2" stroke-dasharray="5 4"/></svg><span><span class="k">Γ (ν)</span> <span data-i="lg3"></span></span></div>
    <div class="lg"><svg width="26" height="16"><defs><pattern id="lgh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#5A6675" stroke-width="1.2"/></pattern></defs><rect x="1" y="1" width="24" height="14" rx="2" fill="url(#lgh)" stroke="#5A6675"/></svg><span><span class="k">G(t)</span> <span data-i="lg4"></span></span></div>
    <div class="lg"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="2" fill="none" stroke="#B5352C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="13" y="12" text-anchor="middle" font-size="10" fill="#B5352C" font-family="serif">?</text></svg><span><span class="k">α ∈ D?</span> <span data-i="lg5"></span></span></div>
    <div class="lg"><svg width="26" height="16"><rect x="8" y="1" width="10" height="14" fill="rgba(181,53,44,.12)" stroke="#B5352C" stroke-width="1"/></svg><span><span class="k">T</span> <span data-i="lg6"></span></span></div>
  </div>
</section>

<section>
  <span class="badge badge-ml" data-i="badgeMl"></span>
  <h2 data-i="inhH"></h2>
  <div class="h2-note" data-i="inhNote"></div>
  <div class="gen-cards">
    <div class="gen">
      <div class="who">νT ≪ 1 · <span data-i="gDad"></span></div>
      <div class="what" data-i="w1"></div>
      <p data-i="t1"></p>
    </div>
    <div class="gen">
      <div class="who">νT ≈ 1 · <span data-i="gMe"></span></div>
      <div class="what" data-i="w2"></div>
      <p data-i="t2"></p>
    </div>
    <div class="gen">
      <div class="who">νT &gt; 1 · <span data-i="gSon"></span></div>
      <div class="what" data-i="w3"></div>
      <p data-i="t3"></p>
      <div class="std-only" style="margin-top:8px"><span class="kx" data-tex="w_{\text{child}}=\mathrm{train}\big(E(t),\mathcal{D}(t)\big)"></span></div>
    </div>
  </div>
  <p class="muted" style="margin-top:18px;font-size:14.5px" data-i="inhFoot"></p>
</section>

<footer>
  <span>S = Φ(E) · 2026</span>
  <span data-i="footShare"></span>
</footer>

var LANG='en', KIDS=false;
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('lang')&&I18N[q.get('lang')])LANG=q.get('lang');
  if(q.get('kids')==='1')KIDS=true;
})();
function L(){return I18N[LANG][KIDS?'kid':'std'];}
function syncUrl(){
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return;
    var q=new URLSearchParams();
    if(LANG!=='en')q.set('lang',LANG);
    if(KIDS)q.set('kids','1');
    var s=q.toString();
    history.replaceState(null,'',location.pathname+(s?'?'+s:''));
  }catch(e){/* sandboxed iframe or file:// — deep links just stay off */}
}

function applyI18n(){
  document.documentElement.lang=LANG;
  document.body.classList.toggle('kids',KIDS);
  document.querySelectorAll('[data-i]').forEach(function(e){
    var v=L()[e.dataset.i]; if(v!==undefined)e.textContent=v;
  });
  document.querySelectorAll('[data-tk]').forEach(function(e){
    var tex=L()[e.dataset.tk]||I18N[LANG].std[e.dataset.tk];
    try{katex.render(tex, e, {throwOnError:false, displayMode:true});}catch(err){e.textContent=tex;}
  });
  document.querySelectorAll('#langs button').forEach(function(b){b.classList.toggle('active',b.dataset.lang===LANG);});
  document.getElementById('kidsBtn').classList.toggle('active',KIDS);
  syncUrl();
  try{draw();}catch(e){console.error('draw failed:',e);}
}

var langsNav=document.getElementById('langs');
Object.keys(I18N).forEach(function(code){
  var b=document.createElement('button');
  b.dataset.lang=code;b.textContent=I18N[code]._name||code;
  b.addEventListener('click',function(){LANG=code;applyI18n();});
  langsNav.appendChild(b);
});
document.getElementById('kidsBtn').addEventListener('click',function(){KIDS=!KIDS;applyI18n();});

document.querySelectorAll('.kx').forEach(function(el){
  try{katex.render(el.dataset.tex, el, {throwOnError:false});}catch(e){el.textContent=el.dataset.tex;}
});
document.querySelectorAll('.kx-d[data-tex]').forEach(function(el){
  try{katex.render(el.dataset.tex, el, {throwOnError:false, displayMode:true});}catch(e){el.textContent=el.dataset.tex;}
});

var SVGNS='http://www.w3.org/2000/svg';
var layers=document.getElementById('layers');
var W=940,H=500, mL=140,mR=26,mT=26,mB=56;
var pw=W-mL-mR, ph=H-mT-mB;
var Y0=1950, Y1=2045, NS=5;
function xOf(year){return mL+(year-Y0)/(Y1-Y0)*pw;}
function yOf(level){return mT+ph-(level/NS)*ph;}

var HIST=[
  {year:1972,level:1.0},
  {year:1994,level:1.5},
  {year:2009,level:2.0},
  {year:2023,level:2.5}
];
var BASE_LEVEL=0.4;

function el(name,attrs,parent){
  var e=document.createElementNS(SVGNS,name);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  (parent||layers).appendChild(e);return e;
}
function txt(x,y,s,attrs,parent){
  var a=attrs||{};a.x=x;a.y=y;
  var e=el('text',a,parent);e.textContent=s;return e;
}
function projectedSteps(nu){
  var steps=[],spacing=10/nu,lvl=2.5,y=2026;
  while(y<Y1&&lvl<4.0){
    y+=spacing;lvl+=0.5;
    if(y<Y1)steps.push({year:y,level:Math.min(lvl,4.0)});
  }
  return steps;
}
function frontierPoints(nu){
  var pts=[{year:Y0,level:BASE_LEVEL}];
  var all=HIST.concat(projectedSteps(nu)), cur=BASE_LEVEL;
  all.forEach(function(s){pts.push({year:s.year,level:cur});pts.push({year:s.year,level:s.level});cur=s.level;});
  pts.push({year:Y1,level:cur});
  return pts;
}
function pathFrom(pts,fromYear,toYear){
  var d='';
  pts.forEach(function(p){
    if(p.year<fromYear||p.year>toYear)return;
    d+=(d===''?'M':'L')+xOf(p.year).toFixed(1)+' '+yOf(p.level).toFixed(1);
  });
  return d;
}

function draw(){
  var birth=+document.getElementById('birth').value;
  var nu=+document.getElementById('nu').value;
  document.getElementById('birthVal').textContent=birth;
  document.getElementById('nuVal').textContent=nu;
  var w0=birth+7,w1=birth+22;

  while(layers.firstChild)layers.removeChild(layers.firstChild);

  var defs=el('defs',{});
  var pat=el('pattern',{id:'hatch',width:'6',height:'6',patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  el('line',{x1:0,y1:0,x2:0,y2:6,stroke:'#5A6675','stroke-width':1.1},pat);

  el('rect',{x:mL,y:mT,width:pw,height:ph,fill:'#FDFDFB'});
  for(var yr=Y0;yr<=Y1;yr+=5){
    var maj=(yr%10===0);
    el('line',{x1:xOf(yr),y1:mT,x2:xOf(yr),y2:mT+ph,stroke:maj?'var(--grid-strong)':'var(--grid)','stroke-width':maj?0.8:0.5});
    if(maj&&yr>Y0&&yr<Y1)txt(xOf(yr),mT+ph+20,yr,{'text-anchor':'middle','font-size':11,fill:'#5A6675','font-family':"'IBM Plex Mono',monospace"});
  }
  for(var i=0;i<=NS*2;i++){
    var lv=i/2,maj2=(i%2===0);
    el('line',{x1:mL,y1:yOf(lv),x2:mL+pw,y2:yOf(lv),stroke:maj2?'var(--grid-strong)':'var(--grid)','stroke-width':maj2?0.8:0.5});
  }
  L().strata.forEach(function(s,i){
    txt(mL-10,yOf(i+0.5)+4,s,{'text-anchor':'end','font-size':12.5,fill:'#23303E','font-family':"'IBM Plex Sans',sans-serif"});
  });

  var pts=frontierPoints(nu);
  var dRegion='M'+mL+' '+(mT+ph);
  pts.forEach(function(p){dRegion+='L'+xOf(p.year).toFixed(1)+' '+yOf(p.level).toFixed(1);});
  dRegion+='L'+(mL+pw)+' '+(mT+ph)+'Z';
  el('path',{d:dRegion,fill:'#D9E6F0','fill-opacity':0.75});

  el('rect',{x:xOf(w0),y:mT,width:Math.max(0,xOf(Math.min(w1,Y1))-xOf(w0)),height:ph,fill:'rgba(181,53,44,.08)',stroke:'#B5352C','stroke-width':1,'stroke-dasharray':'2 3'});

  el('rect',{x:xOf(1978),y:yOf(0.9),width:xOf(1998)-xOf(1978),height:yOf(0.25)-yOf(0.9),fill:'url(#hatch)',stroke:'#5A6675','stroke-width':0.7,rx:3});
  txt(xOf(1988),yOf(0.55)+4,L().gym1,{'text-anchor':'middle','font-size':10.5,fill:'#3C4653','font-family':"'IBM Plex Mono',monospace"});
  el('rect',{x:xOf(2025),y:yOf(2.35),width:xOf(2040)-xOf(2025),height:yOf(1.7)-yOf(2.35),fill:'url(#hatch)',stroke:'#5A6675','stroke-width':0.7,rx:3});
  txt(xOf(2032.5),yOf(2.0)+4,L().gym2,{'text-anchor':'middle','font-size':10.5,fill:'#3C4653','font-family':"'IBM Plex Mono',monospace"});

  el('rect',{x:xOf(2023),y:yOf(3),width:xOf(Y1-1)-xOf(2023),height:yOf(2)-yOf(3),fill:'none',stroke:'#B5352C','stroke-width':1.2,'stroke-dasharray':'5 4',rx:4});
  txt(xOf(2034),yOf(2.5)+6,L().qLabel,{'text-anchor':'middle','font-size':14,fill:'#B5352C','font-family':"'Spectral',serif",'font-style':'italic'});

  el('path',{d:pathFrom(pts,Y0,2026),fill:'none',stroke:'#E0A106','stroke-width':8,'stroke-opacity':0.85,'stroke-linejoin':'round'});
  el('path',{d:pathFrom(pts,Y0,2026),fill:'none',stroke:'#B5352C','stroke-width':2.4,'stroke-linejoin':'round'});
  el('path',{d:pathFrom(pts,2026,Y1),fill:'none',stroke:'#E0A106','stroke-width':8,'stroke-opacity':0.4,'stroke-linejoin':'round'});
  el('path',{d:pathFrom(pts,2026,Y1),fill:'none',stroke:'#B5352C','stroke-width':2.2,'stroke-dasharray':'7 5','stroke-linejoin':'round'});

  HIST.forEach(function(s,i){
    txt(xOf(s.year)+4,yOf(s.level)-8,L().tags[i],{'font-size':10.5,fill:'#8A2620','font-family':"'IBM Plex Mono',monospace"});
  });

  [[1957,L().gDad],[1989,L().gMe],[2019,L().gSon]].forEach(function(g){
    el('path',{d:'M'+xOf(g[0])+' '+(mT+ph)+' l-5 9 l10 0 Z',fill:'#23303E'});
    txt(xOf(g[0]),mT+ph+34,g[1],{'text-anchor':'middle','font-size':11.5,fill:'#23303E','font-family':"'IBM Plex Sans',sans-serif",'font-weight':500});
  });

  txt(mL+pw-4,mT+16,'Γ',{'text-anchor':'end','font-size':17,fill:'#B5352C','font-family':"'Spectral',serif",'font-style':'italic'});

  var all=HIST.concat(projectedSteps(nu));
  var C=all.filter(function(s){return s.year>=w0&&s.year<=w1;}).length;
  var v=document.getElementById('verdict');
  document.getElementById('verdictNum').textContent='C = '+C;
  v.className='verdict '+(C===0?'v-ok':(C===1?'v-edge':'v-crit'));
  document.getElementById('verdictText').textContent=(C===0?L().v0:(C===1?L().v1:L().v2));
}

document.getElementById('birth').addEventListener('input',function(){
  document.querySelectorAll('.presets button').forEach(function(b){b.classList.toggle('active',+b.dataset.year===+document.getElementById('birth').value);});
  draw();
});
document.getElementById('nu').addEventListener('input',draw);
document.querySelectorAll('.presets button').forEach(function(b){
  b.addEventListener('click',function(){
    document.getElementById('birth').value=b.dataset.year;
    document.querySelectorAll('.presets button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    draw();
  });
});

applyI18n();
</script>
