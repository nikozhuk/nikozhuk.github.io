<style>
*{box-sizing:border-box;margin:0;padding:0}
#mcts-wrap{font-family:system-ui,sans-serif;background:#f8f8f6;color:#1a1a1a;
     display:flex;flex-direction:column;min-height:600px;}

/* ── header ── */
#hdr{padding:10px 18px;background:#fff;border-bottom:1px solid #e2e0d8;
     display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#hdr h1{font-size:15px;font-weight:700;letter-spacing:-.3px}
#hdr .sub{font-size:11px;color:#888;margin-top:2px}
#sim-badge{font-size:13px;font-weight:600;background:#f3f2ee;
           border:1px solid #e2e0d8;border-radius:20px;padding:4px 12px}

/* ── main ── */
#main{display:flex;flex:1;overflow:hidden;gap:0}

/* ── left panel ── */
#left{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;
      padding:14px;border-right:1px solid #e2e0d8;background:#fff;overflow-y:auto}
.phead{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
       color:#999;margin-bottom:6px}

/* ── board ── */
#board{display:grid;grid-template-columns:repeat(3,62px);border:1px solid #ccc;
       width:186px;flex-shrink:0}
.sq{width:62px;height:62px;display:flex;align-items:center;justify-content:center}
.sq.light{background:#EEEED2}.sq.dark{background:#769656}
.pawn{width:40px;height:40px;border-radius:50%;display:flex;
      align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pawn.w{background:#fff;color:#111;border:2px solid #bbb}
.pawn.b{background:#222;color:#fff;border:2px solid #555}

/* ── info boxes ── */
.info-box{background:#f7f6f2;border:1px solid #e2e0d8;border-radius:7px;padding:9px 11px}
#phase-label{font-size:12px;font-weight:600;color:#1a1a1a;line-height:1.5}
#value-line{font-size:11px;color:#666;margin-top:3px}

/* ── legend ── */
.leg{display:flex;align-items:center;gap:7px;font-size:11px;color:#555;margin-top:4px}
.ldot{width:12px;height:12px;border-radius:50%;flex-shrink:0}

/* ── right: tree ── */
#right{flex:1;overflow:auto;padding:10px;background:#f8f8f6}
svg#tree{display:block}

/* ── controls ── */
#ctrl{padding:9px 18px;background:#fff;border-top:1px solid #e2e0d8;
      display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap}
.btn{padding:5px 13px;font-size:12px;border:1px solid #ccc;border-radius:6px;
     background:#fff;cursor:pointer;transition:background .12s}
.btn:hover{background:#f0efe9}
.btn.active{background:#769656;color:#fff;border-color:#769656}
.ctrl-group{display:flex;gap:5px;align-items:center}
.ctrl-label{font-size:11px;color:#999}
#prog-wrap{flex:1;min-width:120px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
#prog-fill{height:100%;background:#769656;border-radius:3px;transition:width .15s}
#step-label{font-size:11px;color:#888;white-space:nowrap}
</style>

<div id="mcts-wrap">
<div id="hdr">
  <div>
    <div id="hdr-h1" style="font-size:15px;font-weight:700">Hexapawn · MCTS Visualizer</div>
    <div class="sub">AlphaZero-style search &nbsp;·&nbsp; 100 simulations &nbsp;·&nbsp; model_it10.keras</div>
  </div>
  <div id="sim-badge">Step 0 / 101</div>
</div>

<div id="main">
  <!-- left -->
  <div id="left">
    <div>
      <div class="phead">Board position</div>
      <div id="board"></div>
    </div>

    <div class="info-box">
      <div id="phase-label">Root expansion</div>
      <div id="value-line"></div>
    </div>

    <div>
      <div class="phead">Legend</div>
      <div class="leg"><div class="ldot" style="background:#93C5FD"></div>Selection path</div>
      <div class="leg"><div class="ldot" style="background:#FCD34D"></div>Expansion (neural net)</div>
      <div class="leg"><div class="ldot" style="background:#86EFAC"></div>Backup propagation</div>
      <div class="leg"><div class="ldot" style="background:#dbeafe"></div>Unvisited node</div>
      <div class="leg"><div class="ldot" style="background:#a3e635"></div>High Q (White wins)</div>
      <div class="leg"><div class="ldot" style="background:#f87171"></div>Low Q (Black wins)</div>
    </div>
  </div>

  <!-- right: tree -->
  <div id="right">
    <svg id="tree"><text x="12" y="28" font-size="12" fill="#999">Loading…</text></svg>
  </div>
</div>

<div id="ctrl">
  <div class="ctrl-group">
    <button class="btn" id="btn-reset">↺ Reset</button>
    <button class="btn" id="btn-prev">◀ Prev</button>
    <button class="btn" id="btn-next">▶ Next</button>
    <button class="btn" id="btn-auto">⏵ Auto</button>
    <button class="btn" id="btn-end">⏩ End</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Step</span>
    <input type="range" id="sim-slider" min="0" max="100" value="0"
           style="width:120px;accent-color:#769656">
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Speed</span>
    <input type="range" id="spd" min="1" max="10" value="5" style="width:70px;accent-color:#769656">
  </div>
  <div id="prog-wrap"><div id="prog-fill" style="width:0%"></div></div>
  <div id="step-label">0 / 101</div>
</div>

  for (const c of sim.newNodes) {
    if (nodes[c.id]) continue;
    const nd = TRACE.nodes[String(c.id)];
    const pd = nodes[sim.leafId]?.depth ?? 0;
    nodes[c.id] = {...nd, depth: pd+1, children:[], parentId: sim.leafId,
                   parentMove: c.move, P: c.P, N:0, Q:0};
    nodes[sim.leafId]?.children.push(c.id);
  }
  // Apply backup: update N / Q on each node in the chain
  for (const b of sim.backup) {
    if (nodes[b.nodeId]) {
      nodes[b.nodeId].N = b.N;
      nodes[b.nodeId].Q = b.Q;
    }
  }
}

// ── layout ────────────────────────────────────────────────────────────────

function leafCount(nid) {
  const n = nodes[nid];
  if (!n?.children?.length) return 1;
  return n.children.reduce((s, c) => s + leafCount(c), 0);
}

function doLayout(nid, x0, w) {
  const n = nodes[nid]; if (!n) return;
  n._x = x0 + w/2;
  n._y = n.depth * NH + NR + 10;
  let cx = x0;
  for (const c of (n.children || [])) {
    const cw = Math.max(NC, leafCount(c) * NC);
    doLayout(c, cx, cw); cx += cw;
  }
}

function layout() {
  if (rootId === null) return {W: 200, H: 80};
  const total = Math.max(NC, leafCount(rootId) * NC);
  doLayout(rootId, 10, total);
  let maxX=0, maxY=0;
  for (const n of Object.values(nodes)) {
    maxX = Math.max(maxX, (n._x||0) + NR + 40);
    maxY = Math.max(maxY, (n._y||0) + NR + 30);
  }
  return {W: Math.max(200, maxX), H: Math.max(80, maxY)};
}

// ── colors ────────────────────────────────────────────────────────────────

function lerp(a, b, t) { return a + (b-a)*t; }
function lerpC(c1, c2, t) {
  const h = s => parseInt(s.slice(1),16);
  const [r1,g1,b1]=[h(c1)>>16,(h(c1)>>8)&255,h(c1)&255];
  const [r2,g2,b2]=[h(c2)>>16,(h(c2)>>8)&255,h(c2)&255];
  return `rgb(${Math.round(lerp(r1,r2,t))},${Math.round(lerp(g1,g2,t))},${Math.round(lerp(b1,b2,t))})`;
}

function nodeColor(nid) {
  if (hlNew.includes(nid))  return '#c4b5fd';  // newly added: purple
  if (nid === hlLeaf) {
    if (isTerm) return hlLeafValue > 0 ? '#4ade80' : '#f87171';  // terminal: green/red
    return '#fcd34d';  // expanded by network: yellow
  }
  if (hlBack.includes(nid)) return '#86efac';  // backup path: green
  if (hlSel.includes(nid))  return '#93c5fd';  // selection path: blue
  const n = nodes[nid];
  if (!n || n.N === 0)      return '#dbeafe';  // unvisited
  // steady-state: interpolate gray → lime/red by Q value
  const q = n.Q;
  return q >= 0
    ? lerpC('#e5e7eb', '#a3e635', Math.min(1, q * 1.5))
    : lerpC('#e5e7eb', '#f87171', Math.min(1,-q * 1.5));
}

function nodeBorder(nid) {
  if (hlNew.includes(nid))  return '#7c3aed';
  if (nid === hlLeaf)       return isTerm ? (hlLeafValue>0 ? '#15803d' : '#b91c1c') : '#b45309';
  if (hlBack.includes(nid)) return '#15803d';
  if (hlSel.includes(nid))  return '#1d4ed8';
  const n = nodes[nid];
  if (!n || n.N === 0)      return '#93c5fd';
  return '#9ca3af';
}

// ── SVG helpers ───────────────────────────────────────────────────────────

function el(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

function txt(x, y, t, attrs={}) {
  const e = el('text', {x, y, 'text-anchor':'middle',
                        'font-family':'system-ui,sans-serif', ...attrs});
  e.textContent = t; return e;
}

// ── board rendering ───────────────────────────────────────────────────────

function renderBoard(brd) {
  const c = document.getElementById('board'); c.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const r = Math.floor(i/3), col = i%3;
    const d = document.createElement('div');
    d.className = 'sq ' + ((r+col)%2===0 ? 'light' : 'dark');
    if (brd[i] !== E) {
      const p = document.createElement('div');
      p.className = 'pawn ' + (brd[i]===W ? 'w' : 'b');
      p.textContent = brd[i]===W ? 'W' : 'B';
      d.appendChild(p);
    }
    c.appendChild(d);
  }
}

// ── mini board (18×18 px) inside an SVG node ─────────────────────────────

function miniBoard(svg, brd, cx, cy) {
  const S=5, N=3, off=-(S*N)/2;
  for (let i = 0; i < 9; i++) {
    const r=Math.floor(i/3), c=i%3;
    const light=(r+c)%2===0;
    const rect = el('rect', {
      x: cx+off+c*S, y: cy+off+r*S, width:S, height:S,
      fill: light ? '#EEEED2' : '#769656', rx:0,
    });
    svg.appendChild(rect);
    if (brd[i] === W) {
      const circ = el('circle', {cx:cx+off+c*S+S/2, cy:cy+off+r*S+S/2,
                                  r:1.8, fill:'#fff', stroke:'#bbb','stroke-width':.4});
      svg.appendChild(circ);
    } else if (brd[i] === B) {
      const circ = el('circle', {cx:cx+off+c*S+S/2, cy:cy+off+r*S+S/2,
                                  r:1.8, fill:'#222', stroke:'#555','stroke-width':.4});
      svg.appendChild(circ);
    }
  }
}

// ── move label ────────────────────────────────────────────────────────────

function moveLabel(m) {
  const files='abc', row=i=>3-Math.floor(i/3), col=i=>i%3;
  return files[col(m.from)]+(row(m.from))+'-'+files[col(m.to)]+(row(m.to));
}

// ── tree rendering ────────────────────────────────────────────────────────

function renderTree() {
  const svg = document.getElementById('tree');
  svg.innerHTML = '';
  if (rootId === null) {
    svg.setAttribute('width','200'); svg.setAttribute('height','60');
    svg.appendChild(txt(100, 35, 'Press ▶ Next to start', {'font-size':'12', fill:'#999'}));
    return;
  }
  const {W, H} = layout();
  svg.setAttribute('width', W); svg.setAttribute('height', H);

  // Draw edges first (below nodes)
  for (const [nid, n] of Object.entries(nodes)) {
    if (n.parentId === null) continue;
    const p = nodes[n.parentId]; if (!p) continue;
    const ni = parseInt(nid);
    const isHl = hlBack.includes(ni) || hlSel.includes(ni) ||
                 ni === hlLeaf        || hlNew.includes(ni);
    const line = el('line', {
      x1:p._x, y1:p._y+NR, x2:n._x, y2:n._y-NR,
      stroke: isHl ? '#64748b' : '#d1d5db',
      'stroke-width': isHl ? 1.5 : 1,
    });
    svg.appendChild(line);

    // Edge label: move + P
    if (n.parentMove) {
      const mx=(p._x+n._x)/2+4, my=(p._y+NR+n._y-NR)/2;
      const lbl = el('text', {x:mx, y:my, 'text-anchor':'middle',
                               'font-size':'7.5', 'font-family':'monospace',
                               fill: isHl ? '#374151' : '#9ca3af'});
      lbl.textContent = moveLabel(n.parentMove) + (n.P ? '  p='+n.P.toFixed(2) : '');
      svg.appendChild(lbl);
    }
  }

  // Draw nodes
  for (const [nid, n] of Object.entries(nodes)) {
    const fill   = nodeColor(parseInt(nid));
    const stroke = nodeBorder(parseInt(nid));
    const sw     = hlSel.includes(parseInt(nid)) ||
                   hlBack.includes(parseInt(nid)) ||
                   String(nid)===String(hlLeaf)   ||
                   hlNew.includes(parseInt(nid)) ? 2.2 : 1.2;

    svg.appendChild(el('circle', {cx:n._x, cy:n._y, r:NR,
                                   fill, stroke, 'stroke-width':sw}));
    // mini board
    miniBoard(svg, n.board, n._x, n._y);

    // N label below
    const nLabel = n.N > 0 ? `N=${n.N}` : 'N=0';
    svg.appendChild(txt(n._x, n._y + NR + 11, nLabel,
      {'font-size':'8.5', fill:'#374151', 'font-weight':'600'}));
    if (n.N > 0) {
      const qStr = (n.Q >= 0 ? '+' : '') + n.Q.toFixed(2);
      svg.appendChild(txt(n._x, n._y + NR + 21, qStr,
        {'font-size':'7.5', fill: n.Q>0 ? '#166534' : n.Q<0 ? '#991b1b' : '#6b7280'}));
    }
  }
}

// ── info panel ────────────────────────────────────────────────────────────

function renderInfo(simIdx) {
  const sim = simIdx >= 0 && simIdx < TRACE.sims.length ? TRACE.sims[simIdx] : null;
  let phase, valLine;
  if (!sim) {
    phase   = 'Ready';
    valLine = '← → or buttons to step · Space = next';
  } else if (sim.sim === -1) {
    phase   = 'Root expansion — network evaluates starting position';
    valLine = `Value: ${sim.value >= 0?'+':''}${sim.value.toFixed(3)} · `
            + `${sim.newNodes.length} children created`;
  } else {
    const sn    = sim.sim + 1;
    const depth = sim.path.length - 1;
    const vStr  = `${sim.value >= 0?'+':''}${sim.value.toFixed(3)}`;
    if (sim.terminal) {
      phase   = `Sim ${sn}/100 · Terminal — ${sim.value>0?'White wins':'Black wins'}`;
      valLine = `Depth ${depth} · Value ${vStr} · `
              + `Backup ${sim.backup.length} edge${sim.backup.length!==1?'s':''}`;
    } else {
      phase   = `Sim ${sn}/100 · Select → Expand → Backup`;
      valLine = `Depth ${depth} · Network value ${vStr} · `
              + `${sim.newNodes.length} new node${sim.newNodes.length!==1?'s':''} · `
              + `Backup ${sim.backup.length} edge${sim.backup.length!==1?'s':''}`;
    }
  }
  document.getElementById('phase-label').textContent = phase;
  document.getElementById('value-line').textContent  = valLine;
}

// ── step control ──────────────────────────────────────────────────────────

function goTo(idx) {
  idx = Math.max(0, Math.min(TOTAL-1, idx));
  if (idx === stepIdx) return;

  // Replay forward incrementally if possible, else from scratch
  if (idx > stepIdx && stepIdx >= 0) {
    for (let i = stepIdx+1; i <= idx; i++) _applySimStep(TRACE.sims[i]);
  } else {
    applyUpTo(idx);
  }

  stepIdx = idx;
  const sim = TRACE.sims[idx];

  hlNew       = sim.newNodes.map(c => c.id);
  hlLeaf      = sim.leafId;
  hlLeafValue = sim.value;
  hlSel       = sim.path.filter(id => id !== sim.leafId);
  hlBack      = sim.backup.map(b => b.nodeId).filter(id => id !== sim.leafId);
  isTerm      = sim.terminal;

  // keep slider in sync
  const slider = document.getElementById('sim-slider');
  if (slider) slider.value = idx;

  // Show board for the leaf node
  const boardData = nodes[sim.leafId]?.board || TRACE.initial_board;
  renderBoard(boardData);
  renderInfo(idx);
  renderTree();

  const pct = ((idx+1)/TOTAL*100).toFixed(1);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('step-label').textContent = `${idx+1} / ${TOTAL}`;
  document.getElementById('sim-badge').textContent  =
    idx === 0 ? 'Step 1 / 101 · Root' :
    `Step ${idx+1} / ${TOTAL} · Sim ${sim.sim+1}/100`;
}

// ── button handlers ───────────────────────────────────────────────────────

document.getElementById('btn-reset').onclick = () => { stopAuto(); doReset(); };

document.getElementById('btn-prev').onclick = () => { stopAuto(); goTo(stepIdx-1); };
document.getElementById('btn-next').onclick = () => { stopAuto(); goTo(stepIdx+1); };
document.getElementById('btn-end' ).onclick = () => { stopAuto(); goTo(TOTAL-1);   };

document.getElementById('btn-auto').onclick = () => {
  const btn = document.getElementById('btn-auto');
  if (autoTmr) { stopAuto(); return; }
  btn.classList.add('active');
  const tick = () => {
    if (stepIdx >= TOTAL-1) { stopAuto(); return; }
    goTo(stepIdx+1);
  };
  const ms = Math.round(1400/parseInt(document.getElementById('spd').value));
  tick();
  autoTmr = setInterval(tick, ms);
};

function stopAuto() {
  clearInterval(autoTmr); autoTmr=null;
  document.getElementById('btn-auto').classList.remove('active');
}

// ── slider ────────────────────────────────────────────────────────────────
document.getElementById('sim-slider').max = TOTAL - 1;
document.getElementById('sim-slider').oninput = function() {
  stopAuto(); goTo(parseInt(this.value));
};

// ── keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stopAuto(); goTo(stepIdx+1); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); stopAuto(); goTo(stepIdx-1); }
  if (e.key === 'Home')                        { e.preventDefault(); stopAuto(); doReset(); }
  if (e.key === 'End')                         { e.preventDefault(); stopAuto(); goTo(TOTAL-1); }
});

function doReset() {
  nodes={};rootId=null;stepIdx=-1;
  hlSel=[];hlLeaf=null;hlBack=[];hlNew=[];isTerm=false;hlLeafValue=0;
  renderBoard(TRACE.initial_board);
  renderInfo(-1);
  renderTree();
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('step-label').textContent=`0 / ${TOTAL}`;
  document.getElementById('sim-badge').textContent='Step 0 / 101';
  document.getElementById('sim-slider').value=0;
}

// ── init ──────────────────────────────────────────────────────────────────
renderBoard(TRACE.initial_board);
renderInfo(-1);
renderTree();
</script>
</div>
